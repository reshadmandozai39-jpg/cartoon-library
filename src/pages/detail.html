<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Detailseite – CartoonHub</title>
		<link rel="stylesheet" href="../css/pages/styles.css" />
	</head>
	<body>
		<header class="site-header">
			<div class="nav-container">
				<a href="../../index.html" class="brand">Cartoon<span>Hub</span></a>
			</div>
		</header>

		<main class="detail-main">
			<div class="detail-shell">
				<a href="../../index.html" class="back-link">← Zurück zur Übersicht</a>

				<div class="detail-card">
					<div class="detail-header">
						<div>
							<span class="detail-eyebrow">Cartoon Highlight</span>
							<h1 id="detailTitle">Lade Titel...</h1>
						</div>
						<div class="detail-actions">
							<a href="../../index.html" class="btn btn-primary"
								>Mehr entdecken</a
							>
							<button
								class="btn btn-outline"
								type="button"
								onclick="window.history.back()">
								Zurück
							</button>
						</div>
					</div>

					<div class="detail-content">
						<div class="detail-media">
							<img id="detailImage" src="" alt="" />
							<div class="detail-badges">
								<span id="detailGenre">Genre</span>
								<span id="detailRating">⭐ 4.8</span>
								<span id="detailFans">12K Fans</span>
							</div>
						</div>

						<div class="detail-info">
							<p id="detailDescription">Lade Beschreibung...</p>

							<div class="detail-stats">
								<div class="stat-item">
									<span>Genre</span>
									<strong id="detailGenreStat">-</strong>
								</div>
								<div class="stat-item">
									<span>Bewertung</span>
									<strong id="detailRatingStat">-</strong>
								</div>
								<div class="stat-item">
									<span>Fans</span>
									<strong id="detailFansStat">-</strong>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>

		<script type="module" src="../js/modules/detail.js"></script>
	</body>
</html>
